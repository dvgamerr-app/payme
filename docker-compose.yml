services:
  payme:
    build: .
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/payme
      - DB_DIALECT=postgres
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PORT=3001
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=payme
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
